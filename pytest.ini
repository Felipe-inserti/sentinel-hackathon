[pytest]
addopts = -m "not live_llm"
asyncio_default_fixture_loop_scope = session

markers =
    live_llm: bate no Gemini real via Vertex AI (rede, gasta tokens, exige GCP configurado -- ADC e .env com GCP_PROJECT_ID/GEMINI_MODEL_ID reais). Excluido por padrao; rode manualmente com `pytest -m live_llm`.

# Por padrao, testes marcados live_llm NAO rodam -- `pytest`/`pytest -q`
# continuam rapidos, mockados, seguros para CI. O -m explicito na linha de
# comando sobrescreve o "not live_llm" daqui.
